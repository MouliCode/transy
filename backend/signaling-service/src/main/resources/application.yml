server:
  port: ${SIGNALING_PORT:8082}

spring:
  application:
    name: signaling-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    ws-api-key: ${WS_API_KEY:dev-ws-key}
  logging:
    root-level: ${APP_LOG_ROOT_LEVEL:3}
  redis:
    pubsub-enabled: ${REDIS_PUBSUB_ENABLED:false}
    relay-channel: ${REDIS_RELAY_CHANNEL:signaling:relay}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p service=${spring.application.name} trace=%X{traceId:-} span=%X{spanId:-} logger=%logger{36} msg=%m%n"
