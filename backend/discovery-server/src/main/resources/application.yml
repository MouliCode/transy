server:
  port: ${DISCOVERY_PORT:8761}

spring:
  application:
    name: discovery-server

app:
  security:
    ws-api-key: ${WS_API_KEY:dev-ws-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p service=${spring.application.name} trace=%X{traceId:-} span=%X{spanId:-} logger=%logger{36} msg=%m%n"
