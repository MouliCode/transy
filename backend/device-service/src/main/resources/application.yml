server:
  port: ${DEVICE_PORT:8083}

spring:
  application:
    name: device-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  security:
    ws-api-key: ${WS_API_KEY:dev-ws-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
