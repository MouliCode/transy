services:
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: 8080
      WS_API_KEY: ${WS_API_KEY}
      APP_LOG_ROOT_LEVEL: ${APP_LOG_ROOT_LEVEL:-3}
      LOG_PATH: ${LOG_PATH:-/tmp/logs}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_ERROR_MAX_FILE_SIZE: ${LOG_ERROR_MAX_FILE_SIZE:-20MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
      LOG_QUEUE_SIZE: ${LOG_QUEUE_SIZE:-4096}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://localhost:4318/v1/traces}
    depends_on:
      config-server:
        condition: service_started
      device-service:
        condition: service_started
      discovery-server:
        condition: service_started
      signaling-service:
        condition: service_started
      transfer-service:
        condition: service_started

  signaling-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: signaling-service
    restart: unless-stopped
    ports:
      - "${SIGNALING_PORT:-8082}:8082"
    environment:
      SIGNALING_PORT: 8082
      WS_API_KEY: ${WS_API_KEY}
      APP_LOG_ROOT_LEVEL: ${APP_LOG_ROOT_LEVEL:-3}
      LOG_PATH: ${LOG_PATH:-/tmp/logs}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_ERROR_MAX_FILE_SIZE: ${LOG_ERROR_MAX_FILE_SIZE:-20MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
      LOG_QUEUE_SIZE: ${LOG_QUEUE_SIZE:-4096}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PUBSUB_ENABLED: ${REDIS_PUBSUB_ENABLED:-true}
      REDIS_RELAY_CHANNEL: ${REDIS_RELAY_CHANNEL:-signaling:relay}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://localhost:4318/v1/traces}
    depends_on:
      redis:
        condition: service_healthy

  device-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: device-service
    restart: unless-stopped
    ports:
      - "${DEVICE_PORT:-8083}:8083"
    environment:
      DEVICE_PORT: 8083
      WS_API_KEY: ${WS_API_KEY}
      APP_LOG_ROOT_LEVEL: ${APP_LOG_ROOT_LEVEL:-3}
      LOG_PATH: ${LOG_PATH:-/tmp/logs}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_ERROR_MAX_FILE_SIZE: ${LOG_ERROR_MAX_FILE_SIZE:-20MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
      LOG_QUEUE_SIZE: ${LOG_QUEUE_SIZE:-4096}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://localhost:4318/v1/traces}
    depends_on:
      redis:
        condition: service_healthy

  transfer-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: transfer-service
    restart: unless-stopped
    ports:
      - "${TRANSFER_PORT:-8085}:8085"
    environment:
      TRANSFER_PORT: 8085
      WS_API_KEY: ${WS_API_KEY}
      APP_LOG_ROOT_LEVEL: ${APP_LOG_ROOT_LEVEL:-3}
      LOG_PATH: ${LOG_PATH:-/tmp/logs}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_ERROR_MAX_FILE_SIZE: ${LOG_ERROR_MAX_FILE_SIZE:-20MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
      LOG_QUEUE_SIZE: ${LOG_QUEUE_SIZE:-4096}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-transy}
      POSTGRES_USER: ${POSTGRES_USER:-transy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transy}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://localhost:4318/v1/traces}
    depends_on:
      postgres:
        condition: service_healthy

  config-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: config-server
    restart: unless-stopped
    ports:
      - "${CONFIG_PORT:-8888}:8888"
    environment:
      CONFIG_PORT: 8888
      WS_API_KEY: ${WS_API_KEY}
      APP_LOG_ROOT_LEVEL: ${APP_LOG_ROOT_LEVEL:-3}
      LOG_PATH: ${LOG_PATH:-/tmp/logs}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_ERROR_MAX_FILE_SIZE: ${LOG_ERROR_MAX_FILE_SIZE:-20MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
      LOG_QUEUE_SIZE: ${LOG_QUEUE_SIZE:-4096}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://localhost:4318/v1/traces}

  discovery-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: discovery-server
    restart: unless-stopped
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    environment:
      DISCOVERY_PORT: 8761
      WS_API_KEY: ${WS_API_KEY}
      APP_LOG_ROOT_LEVEL: ${APP_LOG_ROOT_LEVEL:-3}
      LOG_PATH: ${LOG_PATH:-/tmp/logs}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-20MB}
      LOG_ERROR_MAX_FILE_SIZE: ${LOG_ERROR_MAX_FILE_SIZE:-20MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-2GB}
      LOG_QUEUE_SIZE: ${LOG_QUEUE_SIZE:-4096}
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://localhost:4318/v1/traces}

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transy}
      POSTGRES_USER: ${POSTGRES_USER:-transy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transy} -d ${POSTGRES_DB:-transy}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: transy-network
